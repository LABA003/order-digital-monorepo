<div class="layout-wrapper">

  <nav class="sidebar">

    <div class="sidebar-header">
      <div class="logo-icon">R</div>
    </div>

    <ul class="nav-menu">

      <li *ngIf="userRole === 'ADMIN'">
        <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span class="link-text">Dashboard</span>
        </a>
      </li>

      <li *ngIf="userRole === 'MESERO' || userRole === 'ADMIN'">
        <a routerLink="/mesero" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span class="link-text">Pedidos</span>
        </a>
      </li>

      <li *ngIf="userRole === 'COCINERO' || userRole === 'ADMIN'">
        <a routerLink="/cocina" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 13.87A8 8 0 0 1 6 10a6 6 0 0 1 12 0 8 8 0 0 1 0 3.87"></path>
            <path d="M6 20h12a2 2 0 0 0 2-2v-2H4v2a2 2 0 0 0 2 2Z"></path>
            <line x1="12" y1="6" x2="12" y2="2"></line>
            <line x1="10" y1="4" x2="14" y2="4"></line>
          </svg>
          <span class="link-text">Cocina</span>
        </a>
      </li>

      <li *ngIf="userRole === 'CAJERO' || userRole === 'ADMIN'">
        <a routerLink="/caja" routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
          <span class="link-text">Caja</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <button (click)="logout()" class="btn-logout" title="Cerrar Sesión">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
