name: Deploy Order Digital to AWS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: orderdigital-v2-backend
  ECS_CLUSTER: orderdigital-cluster-prod
  ECS_SERVICE: orderdigital-v2-backend-service
  S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
  CLOUDFRONT_DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy-backend:
    name: Build & Deploy Backend (NestJS to ECS Fargate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build backend from gedesoft folder
          docker buildx create --use
          docker buildx build --platform linux/arm64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --push ./gedesoft
          docker buildx build --platform linux/arm64 -t $ECR_REGISTRY/$ECR_REPOSITORY:latest --push ./gedesoft
          
          
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy Backend to EC2 via SSM
        run: |
          COMMANDS="aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY; docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest; docker stop backend || true; docker rm backend || true; docker run -d --name backend --restart always -p 3000:3000 -e DATABASE_URL=\"mysql://admin_luis:OrderDigital_2026!@orderdigital-v2-db-prod.csbwkoecu5x3.us-east-1.rds.amazonaws.com:3306/menu_db\" -e JWT_SECRET=\"SuperSecret123!\" -e CORS_ORIGINS=\"*\" $ECR_REGISTRY/$ECR_REPOSITORY:latest"
          
          # Obtenemos el ID de la instancia basándonos en el tag Name=orderdigital-v2-backend
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=orderdigital-v2-backend" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          
          echo "Desplegando en la instancia: $INSTANCE_ID"
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest backend container" \
            --parameters "commands=[""]" \
            --region $AWS_REGION


  deploy-frontend:
    name: Build & Deploy Frontend (Angular to S3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies and Build
        working-directory: ./gedesoftFront
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Sincroniza la carpeta dist con S3, eliminando archivos huérfanos
          if [ -f ./gedesoftFront/dist/mi-restaurante-frontend/browser/index.csr.html ]; then mv ./gedesoftFront/dist/mi-restaurante-frontend/browser/index.csr.html ./gedesoftFront/dist/mi-restaurante-frontend/browser/index.html; fi
          aws s3 sync ./gedesoftFront/dist/mi-restaurante-frontend/browser s3://$S3_BUCKET --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION --paths "/*"








